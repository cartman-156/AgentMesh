name: AgentMesh CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  backend-tests:
    name: Python unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run backend unit tests
        run: |
          pytest -v

      - name: Generate coverage report
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml
        continue-on-error: true

  frontend-tests:
    name: UI unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: Frontend/node_modules
          key: frontend-node-modules-${{ hashFiles('Frontend/package.json') }}
          restore-keys: |
            frontend-node-modules-

      - name: Install dependencies
        run: npm install

      - name: Run frontend unit tests
        run: npm test -- --run

      - name: Generate coverage report
        run: npm test -- --run --coverage
        continue-on-error: true

  publish-images:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    # Publish only from main and develop branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Backend image
      # =========================

      - name: Extract metadata for backend image
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/agentmesh-backend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=agentmesh-backend
            org.opencontainers.image.description=AgentMesh backend service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================
      # Frontend image
      # =========================

      - name: Extract metadata for frontend image
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/agentmesh-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=agentmesh-frontend
            org.opencontainers.image.description=AgentMesh frontend service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max